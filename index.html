<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E7C86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="专注记录台">
<title>专注记录台 · Focus Ledger</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --bg:#EEF1F5; --panel:#FFFFFF; --panel-2:#F4F7F9; --border:#E3E8EE; --text:#1F2A37; --muted:#6B7785;
    --accent:#0E7C86; /* 深青 */
    --focus:#0E7C86; --break:#E08A1E; --danger:#D9694A; --shadow:0 6px 22px rgba(31,42,55,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"Inter","Segoe UI",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;padding:18px;min-height:100%}
  .wrap{max-width:1080px;margin:0 auto;display:grid;gap:16px}
  @media(min-width:860px){.wrap{grid-template-columns:380px 1fr;align-items:start}}
  /* topbar */
  .topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
  .brand h1{font-size:16px;font-weight:700}
  .brand p{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
  .top-actions{display:flex;gap:10px;align-items:center}
  .sync-btn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);
    padding:7px 13px;border-radius:999px;cursor:pointer;font-family:inherit;transition:.15s}
  .sync-btn:hover{border-color:var(--accent);color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(14,124,134,.15)}
  .dot.off{background:#B6BFCA;box-shadow:none}
  .dot.err{background:var(--danger);box-shadow:0 0 0 4px rgba(217,105,74,.18)}
  .dot.busy{background:var(--break);box-shadow:0 0 0 4px rgba(224,138,30,.15)}
  /* record entry card */
  .hero{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px 22px;box-shadow:var(--shadow)}
  .goal{margin-bottom:20px}
  .goal-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:9px;letter-spacing:1px}
  .goal-top b{color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .bar{height:9px;background:var(--panel-2);border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#13a3af);border-radius:999px;transition:width .4s ease}
  .log-btns{display:flex;gap:12px;margin:6px 0 12px}
  .log-btns .btn{flex:1;padding:16px 0;font-size:15px}
  .btn{border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;font-weight:600;
    border-radius:11px;cursor:pointer;letter-spacing:1px;transition:.15s;font-family:inherit}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.primary:hover{color:#fff;opacity:.92}
  .btn.break{background:transparent;color:var(--break);border-color:rgba(224,138,30,.45)}
  .btn.break:hover{background:rgba(224,138,30,.08);color:var(--break)}
  .btn.ghost{width:100%;margin:0 0 16px;padding:11px 0;font-size:13px;color:var(--muted);border-style:dashed;letter-spacing:.5px}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .cat{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .chip{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;background:var(--panel);user-select:none;transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{color:var(--accent);border-color:var(--accent);background:rgba(14,124,134,.06)}
  .chip.edit{border-style:dashed;color:var(--accent);border-color:rgba(14,124,134,.5)}
  .note{width:100%;margin-top:14px;background:var(--panel-2);border:1px solid var(--border);border-radius:11px;
    padding:11px 14px;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:none}
  .note::placeholder{color:var(--muted)}
  .note:focus{border-color:var(--accent)}
  /* right column */
  .right{display:grid;gap:16px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
  .stat .n{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:4px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .card h2{font-size:14px;padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .card h2 .meta{font-size:11px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:12px}
  .tbl-wrap{max-height:460px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--border)}
  thead th{position:sticky;top:0;background:var(--panel);z-index:1}
  th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase}
  tr:last-child td{border-bottom:0}
  .tag{font-size:11px;padding:3px 9px;border-radius:6px;font-weight:600;white-space:nowrap}
  .tag.work{background:rgba(14,124,134,.12);color:#0E7C86}
  .tag.break{background:rgba(224,138,30,.12);color:#C2760F}
  .cat-pill{color:var(--muted);white-space:nowrap}
  .cat-pill:empty::before{content:'—'}
  .note-pill{color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-pill:empty::before{content:'—'}
  .empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px}
  /* 按日期分组折叠 */
  .day{border-bottom:1px solid var(--border)}
  .day:last-child{border-bottom:0}
  .day-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--panel);
    border:0;cursor:pointer;font-family:inherit;text-align:left;color:var(--text);transition:background .12s}
  .day-head:hover{background:var(--panel-2)}
  .chev{font-size:12px;line-height:1;color:var(--muted);display:inline-block;width:12px;text-align:center;transition:transform .2s ease}
  .day.collapsed .chev{transform:rotate(-90deg)}
  .day-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:13px;font-weight:700;letter-spacing:.3px}
  .day-meta{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .day-tbl{width:100%;border-collapse:collapse;font-size:13px}
  .day.collapsed .day-tbl{display:none}
  .day:not(.first) .day-tbl thead{display:none}
  .day-toggle{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--border);
    padding:4px 11px;border-radius:999px;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:.12s}
  .day-toggle:hover{border-color:var(--accent);color:var(--accent)}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(31,42,55,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal[hidden]{display:none}
  .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);
    width:100%;max-width:420px;padding:22px;max-height:92vh;overflow:auto}
  .modal-box h3{font-size:16px;margin-bottom:16px}
  .modal-box label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;letter-spacing:.5px}
  .modal-box input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-family:inherit;outline:none;background:var(--panel)}
  .modal-box input:focus{border-color:var(--accent)}
  .modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .modal-actions .btn{flex:1;padding:11px 0;font-size:13px;min-width:88px}
  .sync-status{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6;white-space:pre-wrap;min-height:18px}
  .sync-status.ok{color:var(--accent)}
  .sync-status.bad{color:var(--danger)}
  /* segmented control */
  .seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .seg-btn{flex:1;padding:10px 0;background:var(--panel);border:0;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s}
  .seg-btn.on{background:var(--accent);color:#fff}
  .seg-btn + .seg-btn{border-left:1px solid var(--border)}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .row2{display:flex;gap:10px}
  .row2 > *{flex:1}
  /* category manager */
  .cat-mgr{display:grid;gap:8px;max-height:238px;overflow:auto;padding-right:2px}
  .cat-row{display:flex;gap:8px;align-items:center}
  .cat-row input{flex:1}
  .cat-del{padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--danger);
    font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.12s}
  .cat-del:hover{border-color:var(--danger);background:rgba(217,105,74,.06)}
  .cat-add{display:flex;gap:8px;margin-top:12px}
  .cat-add input{flex:1}
  .cat-add .btn{padding:0 16px;font-size:13px}
  .cat-empty{padding:14px;text-align:center;color:var(--muted);font-size:12px}
  /* row actions (edit/delete) */
  .row-actions{display:flex;gap:12px;white-space:nowrap}
  .act{font-size:12px;cursor:pointer;background:none;border:0;font-family:inherit;padding:0;letter-spacing:.5px;color:var(--accent);transition:.12s}
  .act:hover{text-decoration:underline}
  .act.del{color:var(--danger)}
  .confirm-msg{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 4px;word-break:break-all}
  /* ===== 手机端：记录表 → 卡片视图（备注整行换行，永不横滑） ===== */
  @media(max-width:768px){
    body{padding:12px}
    .tbl-wrap{max-height:none;overflow:visible}
    .card table,.card tbody{display:block;width:100%}
    .card thead{display:none}
    .card tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
      padding:13px 15px;border-bottom:1px solid var(--border)}
    .card tr:last-child{border-bottom:0}
    .card tr:nth-child(even){background:#FBFCFD}
    .card td{display:block;width:auto;flex:0 0 auto;padding:0;border:0}
    .card td.c-time{order:1;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
    .card td.c-type{order:2}
    .card td.c-type .tag{padding:2px 8px;border-radius:5px;font-size:10px}
    .card td.c-dur{order:3;font-size:11px;color:var(--muted)}
    .card td.cat-pill{order:4;font-size:11px;color:var(--accent)}
    .card td.cat-pill:not(:empty)::before{content:'· '}
    .card td.cat-pill:empty{display:none}
    .card td.c-acts{order:5;margin-left:auto}
    .card td.c-acts .row-actions{gap:14px}
    .card td.c-acts .act{font-size:12px;padding:3px 0}
    .card td.note-pill{order:6;flex:0 0 100%;max-width:none;
      overflow:visible;text-overflow:clip;white-space:normal;
      color:var(--text);font-size:13px;line-height:1.68;
      word-break:break-word;overflow-wrap:anywhere}
    .card td.note-pill:empty::before{content:'（无备注）';color:var(--muted);font-size:12px}
    .card .day-head{padding:12px 15px;gap:8px}
    .card .day-label{font-size:12px}
    .card .day-meta{font-size:10px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">25</div>
      <div><h1>专注记录台</h1><p>Focus Ledger</p></div>
    </div>
    <div class="top-actions">
      <button class="sync-btn" id="syncOpen"><span class="dot off" id="syncDot"></span><span id="syncLabel">未同步</span></button>
    </div>
  </div>

  <div class="hero">
    <div class="goal">
      <div class="goal-top"><span>今日专注目标</span><b id="goalTxt">0 / 250 分钟</b></div>
      <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    </div>
    <div class="log-btns">
      <button class="btn primary" id="addWork">＋ 专注 25′</button>
      <button class="btn break" id="addBreak">＋ 休息 5′</button>
    </div>
    <button class="btn ghost" id="openCustom">＋ 自定义一笔（时长 / 时间可改）</button>
    <div class="cat" id="catBox"></div>
    <input class="note" id="note" placeholder="备注（可选）：这一段做了什么">
  </div>

  <div class="right">
    <div class="stats">
      <div class="stat"><div class="n" id="stCount">0</div><div class="l">今日番茄</div></div>
      <div class="stat"><div class="n" id="stMin">0′</div><div class="l">今日专注</div></div>
      <div class="stat"><div class="n" id="stStreak">0</div><div class="l">连续天数</div></div>
    </div>
    <div class="card">
      <h2>专注记录表 <span class="meta"><button class="day-toggle" id="dayToggle" type="button">全部折叠</button><span id="logCount">共 0 条</span></span></h2>
      <div class="tbl-wrap">
        <div id="log"></div>
      </div>
      <div class="empty" id="empty" hidden>还没有记录，点上方的「＋ 专注 25′」记第一笔。</div>
    </div>
  </div>
</div>

<!-- 自定义录入 -->
<div class="modal" id="customModal" hidden>
  <div class="modal-box">
    <h3>自定义一笔</h3>
    <label>类型</label>
    <div class="seg" id="cType">
      <button class="seg-btn on" data-t="work">专注</button>
      <button class="seg-btn" data-t="break">休息</button>
    </div>
    <label>时长（分钟）</label>
    <div class="quick" id="cQuick">
      <span class="chip" data-m="15">15</span><span class="chip" data-m="25">25</span>
      <span class="chip" data-m="45">45</span><span class="chip" data-m="60">60</span>
      <span class="chip" data-m="90">90</span>
    </div>
    <input id="cMin" type="number" min="1" max="1440" value="25" inputmode="numeric">
    <label>发生时间（默认现在，可补录过去）</label>
    <input id="cWhen" type="datetime-local">
    <div id="cCatWrap">
      <label>分类</label>
      <div class="cat" id="cCatBox"></div>
    </div>
    <label>备注（可选）</label>
    <input id="cNote" placeholder="这一段做了什么">
    <div class="modal-actions">
      <button class="btn primary" id="cSave">记一笔</button>
      <button class="btn" id="cNow">设为现在</button>
      <button class="btn break" id="cClose">取消</button>
    </div>
  </div>
</div>

<!-- 类别管理 -->
<div class="modal" id="catModal" hidden>
  <div class="modal-box">
    <h3>类别管理</h3>
    <div class="cat-mgr" id="catMgrList"></div>
    <div class="cat-add">
      <input id="catNew" placeholder="新类别名称" maxlength="12">
      <button class="btn" id="catAddBtn">添加</button>
    </div>
    <div class="modal-actions">
      <button class="btn primary" id="catSave">保存</button>
      <button class="btn break" id="catClose">取消</button>
    </div>
    <div class="sync-status" id="catStatus"></div>
  </div>
</div>

<!-- 云端同步 -->
<div class="modal" id="syncModal" hidden>
  <div class="modal-box">
    <h3>云端同步设置</h3>
    <label>GitHub Token（仅需 gist 权限）</label>
    <input id="syncToken" type="password" placeholder="ghp_..." autocomplete="off">
    <label>Gist ID（留空＝首次启用自动创建）</label>
    <input id="syncGist" placeholder="留空自动创建" autocomplete="off">
    <div class="modal-actions">
      <button class="btn primary" id="syncEnable">启用同步</button>
      <button class="btn" id="syncDiag">同步诊断</button>
      <button class="btn break" id="syncClose">关闭</button>
    </div>
    <div class="sync-status" id="syncStatus"></div>
  </div>
</div>

<!-- 编辑记录 -->
<div class="modal" id="editModal" hidden>
  <div class="modal-box">
    <h3>编辑记录</h3>
    <label>类型</label>
    <div class="seg" id="eType">
      <button class="seg-btn on" data-t="work">专注</button>
      <button class="seg-btn" data-t="break">休息</button>
    </div>
    <label>时长（分钟）</label>
    <div class="quick" id="eQuick">
      <span class="chip" data-m="15">15</span><span class="chip" data-m="25">25</span>
      <span class="chip" data-m="45">45</span><span class="chip" data-m="60">60</span>
      <span class="chip" data-m="90">90</span>
    </div>
    <input id="eMin" type="number" min="1" max="1440" value="25" inputmode="numeric">
    <label>发生时间</label>
    <input id="eWhen" type="datetime-local">
    <div id="eCatWrap">
      <label>分类</label>
      <div class="cat" id="eCatBox"></div>
    </div>
    <label>备注（可选）</label>
    <input id="eNote" placeholder="这一段做了什么">
    <div class="modal-actions">
      <button class="btn primary" id="eSave">保存</button>
      <button class="btn break" id="eClose">取消</button>
    </div>
  </div>
</div>

<!-- 确认删除 -->
<div class="modal" id="confirmModal" hidden>
  <div class="modal-box">
    <h3 id="confirmTitle">确认删除</h3>
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="modal-actions">
      <button class="btn primary" id="confirmCancel">取消</button>
      <button class="btn break" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  const APP='focus_ledger', GOAL=250;
  const DATA_KEY=APP+'_v1', SYNC_KEY=APP+'_sync_v1', GIST_FILE=APP+'_data.json';
  const DEFAULT_CATS=[{id:'c_work',name:'深度工作'},{id:'c_read',name:'阅读'},{id:'c_trade',name:'交易复盘'},{id:'c_en',name:'英语'}];
  const $ = id => document.getElementById(id);

  // ---- data layer ----
  let state = loadData();
  function loadData(){
    let d=null; try{ d=JSON.parse(localStorage.getItem(DATA_KEY)); }catch(e){}
    if(!(d&&Array.isArray(d.entries))) d={entries:[]};
    if(!Array.isArray(d.cats)) d.cats=DEFAULT_CATS.map(c=>({id:c.id,name:c.name,updatedAt:0}));
    return d;
  }
  function saveData(){ localStorage.setItem(DATA_KEY, JSON.stringify(state)); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+day; }
  function fmtTime(ts){ const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function todayStr(){ return fmtDate(new Date()); }
  function toLocalInput(ts){ const d=new Date(ts),p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function entryMin(e){ return (typeof e.min==='number'&&e.min>0)?e.min:(e.type==='break'?5:25); }
  function visibleCats(){ return (state.cats||[]).filter(c=>!c.deleted); }

  // ---- ui state ----
  let collapsed = loadCollapsedSet();
  function loadCollapsedSet(){ try{ const a=JSON.parse(localStorage.getItem(APP+'_collapsed')); return new Set(Array.isArray(a)?a:[]); }catch(e){ return new Set(); } }
  function saveCollapsed(){ try{ localStorage.setItem(APP+'_collapsed', JSON.stringify(Array.from(collapsed))); }catch(e){} }
  function dayLabel(d,today){
    const dt=new Date(d+'T00:00:00');
    const wd=['日','一','二','三','四','五','六'][dt.getDay()];
    let pre='';
    if(d===today) pre='今天';
    else { const y=new Date(today+'T00:00:00'); y.setDate(y.getDate()-1); if(d===fmtDate(y)) pre='昨天'; }
    return (pre?pre+' · ':'')+d.slice(5)+' 周'+wd;
  }
  let cat = (visibleCats()[0]||{}).name || '';
  const logEl=$('log'), noteEl=$('note'), barFill=$('barFill'), goalTxt=$('goalTxt'),
        stCount=$('stCount'), stMin=$('stMin'), stStreak=$('stStreak'), logCount=$('logCount'), emptyEl=$('empty');

  function render(){
    const today=todayStr();
    const sorted=state.entries.slice().sort((a,b)=>b.ts-a.ts);
    let todayWork=0, todayMin=0, todayCnt=0;
    sorted.forEach(e=>{
      const isToday=fmtDate(new Date(e.ts))===today;
      const m=entryMin(e);
      if(isToday) todayCnt++;
      if(e.type==='work'&&isToday){ todayWork++; todayMin+=m; }
    });
    const groups={};
    sorted.forEach(e=>{ const d=fmtDate(new Date(e.ts)); (groups[d]=groups[d]||[]).push(e); });
    const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
    logEl.innerHTML='';
    dates.forEach((d,i)=>{
      const entries=groups[d];
      const dMin=entries.filter(e=>e.type==='work').reduce((s,e)=>s+entryMin(e),0);
      const div=document.createElement('div');
      div.className='day'+(i===0?' first':'')+(collapsed.has(d)?' collapsed':'');
      const head=document.createElement('button'); head.className='day-head'; head.type='button';
      head.innerHTML='<span class="chev">▾</span><span class="day-label">'+dayLabel(d,today)+
        '</span><span class="day-meta">'+entries.length+' 笔 · 专注 '+dMin+'′</span>';
      head.onclick=()=>{
        const on=div.classList.toggle('collapsed');
        if(on) collapsed.add(d); else collapsed.delete(d);
        saveCollapsed();
      };
      const tbl=document.createElement('table'); tbl.className='day-tbl';
      tbl.innerHTML='<thead><tr><th>时间</th><th>类型</th><th>时长</th><th>分类</th><th>备注</th><th>操作</th></tr></thead>';
      const tb=document.createElement('tbody');
      entries.forEach(e=>{
        const m=entryMin(e);
        const tr=document.createElement('tr');
        const td1=document.createElement('td'); td1.className='c-time'; td1.textContent=fmtTime(e.ts);
        const td2=document.createElement('td'); td2.className='c-type'; td2.innerHTML='<span class="tag '+e.type+'">'+(e.type==='work'?'专注':'休息')+'</span>';
        const td3=document.createElement('td'); td3.className='c-dur'; td3.textContent=m+'′';
        const td4=document.createElement('td'); td4.className='cat-pill'; if(e.type==='work'&&e.cat){ td4.textContent=e.cat; }
        const td5=document.createElement('td'); td5.className='note-pill'; if(e.note){ td5.textContent=e.note; td5.title=e.note; }
        const td6=document.createElement('td'); td6.className='c-acts';
        const acts=document.createElement('div'); acts.className='row-actions';
        const ed=document.createElement('button'); ed.className='act'; ed.textContent='编辑';
        ed.onclick=()=>openEdit(e.id);
        const dl=document.createElement('button'); dl.className='act del'; dl.textContent='删除';
        dl.onclick=()=>deleteEntry(e.id);
        acts.appendChild(ed); acts.appendChild(dl); td6.appendChild(acts);
        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3); tr.appendChild(td4); tr.appendChild(td5); tr.appendChild(td6);
        tb.appendChild(tr);
      });
      tbl.appendChild(tb); div.appendChild(head); div.appendChild(tbl);
      logEl.appendChild(div);
    });
    emptyEl.hidden=state.entries.length>0;
    stCount.textContent=todayWork;
    stMin.textContent=todayMin+"′";
    stStreak.textContent=streak();
    goalTxt.textContent=todayMin+' / '+GOAL+' 分钟';
    barFill.style.width=Math.min(100,Math.round(todayMin/GOAL*100))+'%';
    logCount.textContent='共 '+state.entries.length+' 条 · '+dates.length+' 天';
    $('dayToggle').textContent = (collapsed.size>0 && dates.length>0) ? '全部展开' : '全部折叠';
    renderCatChips();
  }

  function renderCatChips(){
    const box=$('catBox'); box.innerHTML='';
    const list=visibleCats();
    if(!list.some(c=>c.name===cat)) cat=list[0]?list[0].name:'';
    list.forEach(c=>{
      const s=document.createElement('span');
      s.className='chip'+(c.name===cat?' on':'');
      s.textContent=c.name;
      s.onclick=()=>{ cat=c.name; renderCatChips(); };
      box.appendChild(s);
    });
    const e=document.createElement('span');
    e.className='chip edit'; e.textContent='编辑类别';
    e.onclick=openCatMgr;
    box.appendChild(e);
  }

  function streak(){
    const days=new Set(state.entries.filter(e=>e.type==='work').map(e=>fmtDate(new Date(e.ts))));
    if(days.size===0) return 0;
    let d=new Date(); d.setHours(0,0,0,0);
    if(!days.has(fmtDate(d))){ d.setDate(d.getDate()-1); if(!days.has(fmtDate(d))) return 0; }
    let count=0;
    while(days.has(fmtDate(d))){ count++; d.setDate(d.getDate()-1); }
    return count;
  }

  function add(type,min,ts,note){
    state.entries.push({id:uid(), ts:ts||Date.now(), type:type, min:min, cat:type==='work'?cat:'', note:(note||'').trim()});
    saveData(); render(); schedulePush();
  }

  // ---- 自定义录入 ----
  let cType='work', cCat=cat;
  function paintCType(){
    $('cType').querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('on', b.dataset.t===cType));
    $('cCatWrap').hidden = (cType!=='work');
  }
  function paintQuick(v){ $('cQuick').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', +c.dataset.m===v)); }
  function renderCCats(){
    const box=$('cCatBox'); box.innerHTML='';
    visibleCats().forEach(c=>{
      const s=document.createElement('span');
      s.className='chip'+(c.name===cCat?' on':''); s.textContent=c.name;
      s.onclick=()=>{ cCat=c.name; renderCCats(); };
      box.appendChild(s);
    });
  }
  function openCustom(){
    cType='work'; paintCType();
    $('cMin').value=25; paintQuick(25);
    $('cWhen').value=toLocalInput(Date.now());
    cCat=cat; renderCCats();
    $('cNote').value='';
    $('customModal').hidden=false;
  }

  // ---- 类别管理 ----
  let catDraft=null;
  function openCatMgr(){
    catDraft = visibleCats().map(c=>({id:c.id, name:c.name, orig:c.name}));
    renderCatMgr(); setCatStatus('');
    $('catModal').hidden=false;
  }
  function renderCatMgr(){
    const box=$('catMgrList'); box.innerHTML='';
    if(!catDraft.length){ const p=document.createElement('div'); p.className='cat-empty'; box.appendChild(p);
      p.textContent='暂无类别，请在下方添加。'; }
    catDraft.forEach((row,i)=>{
      const div=document.createElement('div'); div.className='cat-row';
      const inp=document.createElement('input'); inp.className='cat-name'; inp.value=row.name; inp.maxLength=12;
      inp.oninput=()=>{ row.name=inp.value; };
      const del=document.createElement('button'); del.className='cat-del'; del.textContent='删除';
      del.onclick=()=>{ catDraft.splice(i,1); renderCatMgr(); };
      div.appendChild(inp); div.appendChild(del); box.appendChild(div);
    });
  }
  function setCatStatus(msg,kind){ const el=$('catStatus'); el.textContent=msg; el.className='sync-status'+(kind?(' '+kind):''); }
  function renameEntries(from,to){ state.entries.forEach(e=>{ if(e.cat===from) e.cat=to; }); }
  function saveCatMgr(){
    const names=catDraft.map(r=>String(r.name).trim());
    if(names.some(n=>!n)){ setCatStatus('类别名称不能为空','bad'); return; }
    if(new Set(names).size!==names.length){ setCatStatus('存在重复的类别名称','bad'); return; }
    const now=Date.now();
    const draftIds=new Set(catDraft.map(r=>r.id));
    (state.cats||[]).forEach(c=>{ if(!c.deleted && !draftIds.has(c.id)){ c.deleted=true; c.updatedAt=now; } });
    catDraft.forEach(row=>{
      const name=String(row.name).trim();
      if(row.orig===null){ state.cats.push({id:row.id, name:name, updatedAt:now}); }
      else {
        const c=state.cats.find(x=>x.id===row.id);
        if(c && c.name!==name){ renameEntries(c.name,name); c.name=name; c.updatedAt=now; }
      }
    });
    if(!visibleCats().some(c=>c.name===cat)) cat=(visibleCats()[0]||{}).name||'';
    saveData(); render(); schedulePush();
    $('catModal').hidden=true;
  }

  // ---- sync engine ----
  let cfg=loadCfg();
  function loadCfg(){ try{ const c=JSON.parse(localStorage.getItem(SYNC_KEY)); if(c) return c; }catch(e){} return {token:'',gistId:'',enabled:false}; }
  function saveCfg(){ localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); }

  let syncBusy=false, lastSync=0, syncErr='', pushTimer=null;
  function updateChip(){
    const dot=$('syncDot'), label=$('syncLabel');
    dot.className='dot'+(!cfg.enabled?' off':syncBusy?' busy':syncErr?' err':'');
    label.textContent = !cfg.enabled?'未同步' : syncBusy?'同步中…' : syncErr?'同步失败' : (lastSync?('已同步 · '+ago(lastSync)):'已同步');
  }
  function ago(ts){ const s=Math.floor((Date.now()-ts)/1000); if(s<60) return s+'s 前'; const m=Math.floor(s/60); if(m<60) return m+'m 前'; return Math.floor(m/60)+'h 前'; }

  async function gistReq(method,path,body){
    const r=await fetch('https://api.github.com'+path,{
      method, headers:{Authorization:'token '+cfg.token, Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body: body?JSON.stringify(body):undefined
    });
    if(!r.ok){ let t=''; try{t=await r.text();}catch(e){} throw {status:r.status, body:t}; }
    return r.json();
  }
  function mergeById(local,incoming,key){
    const map=new Map(); local.forEach(x=>map.set(x[key],x));
    (incoming||[]).forEach(x=>{ if(x&&x[key]) map.set(x[key],x); });
    return Array.from(map.values());
  }
  function mergeCats(local,incoming){
    const map=new Map(); (local||[]).forEach(c=>map.set(c.id,c));
    (incoming||[]).forEach(c=>{ if(!c||!c.id) return; const p=map.get(c.id);
      if(!p || (c.updatedAt||0) > (p.updatedAt||0)) map.set(c.id,c); });
    return Array.from(map.values());
  }
  async function pushSync(){
    if(!cfg.enabled||!cfg.token) return;
    syncBusy=true; updateChip();
    try{
      const payload={updatedAt:Date.now(), entries:state.entries, cats:state.cats};
      const content=JSON.stringify(payload);
      if(!cfg.gistId){
        const j=await gistReq('POST','/gists',{public:false, files:{[GIST_FILE]:{content}}});
        cfg.gistId=j.id; saveCfg();
        setStatus('已创建 Gist：'+j.id+'（把这串 ID 抄给其它设备即可共享同一份数据）','ok');
      }else{
        await gistReq('PATCH','/gists/'+cfg.gistId,{files:{[GIST_FILE]:{content}}});
      }
      lastSync=Date.now(); syncErr='';
    }catch(e){
      syncErr=(e&&e.status)||'err';
      if([401,403,404].includes(Number(syncErr))){ cfg.enabled=false; saveCfg();
        setStatus('Token 无效或已过期（'+(e&&e.status)+'）。请到 github.com/settings/tokens 新建一支仅 gist 权限的 Token 后重填。','bad'); }
    }finally{ syncBusy=false; updateChip(); }
  }
  async function pullSync(){
    if(!cfg.enabled||!cfg.token||!cfg.gistId) return;
    try{
      const j=await gistReq('GET','/gists/'+cfg.gistId);
      const f=j.files&&j.files[GIST_FILE]; if(!f||!f.content) return;
      const data=JSON.parse(f.content);
      if(data.entries) state.entries=mergeById(state.entries,data.entries,'id');
      if(data.cats) state.cats=mergeCats(state.cats,data.cats);
      saveData();
      const ae=document.activeElement;
      if(!(ae&&/INPUT|TEXTAREA/.test(ae.tagName))) render();
      lastSync=Date.now(); syncErr='';
    }catch(e){ syncErr=(e&&e.status)||'err'; }
    finally{ updateChip(); }
  }
  function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushSync,800); }
  async function syncNow(){ await pullSync(); await pushSync(); }
  function startAutoPull(){
    setInterval(()=>{ if(cfg.enabled&&cfg.token&&cfg.gistId&&!syncBusy){
      const ae=document.activeElement; if(ae&&/INPUT|TEXTAREA/.test(ae.tagName)) return; pullSync();
    } }, 45000);
  }

  function setStatus(msg,kind){ const el=$('syncStatus'); el.textContent=msg; el.className='sync-status'+(kind?(' '+kind):''); }

  // ---- events ----
  $('addWork').onclick=()=>{ add('work',25,Date.now(),noteEl.value); noteEl.value=''; };
  $('addBreak').onclick=()=>{ add('break',5,Date.now(),noteEl.value); noteEl.value=''; };
  $('openCustom').onclick=openCustom;
  $('dayToggle').onclick=()=>{
    const dates=[...new Set(state.entries.map(e=>fmtDate(new Date(e.ts))))];
    if(collapsed.size>0){ collapsed.clear(); } else { dates.forEach(d=>collapsed.add(d)); }
    saveCollapsed(); render();
  };
  $('cType').querySelectorAll('.seg-btn').forEach(b=>b.onclick=()=>{ cType=b.dataset.t; paintCType(); });
  $('cQuick').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ $('cMin').value=c.dataset.m; paintQuick(+c.dataset.m); });
  $('cMin').oninput=()=>paintQuick(parseInt($('cMin').value,10));
  $('cNow').onclick=()=>{ $('cWhen').value=toLocalInput(Date.now()); };
  $('cClose').onclick=()=>{ $('customModal').hidden=true; };
  $('cSave').onclick=()=>{
    let m=parseInt($('cMin').value,10); if(!(m>0)) m=25; m=Math.min(1440,m);
    let ts=new Date($('cWhen').value).getTime(); if(isNaN(ts)) ts=Date.now();
    add(cType,m,ts,$('cNote').value);
    if(cType==='work'){ cat=cCat; }
    $('customModal').hidden=true;
  };

  // ---- 编辑 / 删除 ----
  let eType='work', eCat=cat, editId=null;
  function paintEType(){
    $('eType').querySelectorAll('.seg-btn').forEach(b=>b.classList.toggle('on', b.dataset.t===eType));
    $('eCatWrap').hidden = (eType!=='work');
  }
  function paintEQuick(v){ $('eQuick').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', +c.dataset.m===v)); }
  function renderECats(){
    const box=$('eCatBox'); box.innerHTML='';
    visibleCats().forEach(c=>{
      const s=document.createElement('span');
      s.className='chip'+(c.name===eCat?' on':''); s.textContent=c.name;
      s.onclick=()=>{ eCat=c.name; renderECats(); };
      box.appendChild(s);
    });
  }
  function openEdit(id){
    const e=state.entries.find(x=>x.id===id); if(!e) return;
    editId=id; eType=e.type; paintEType();
    const m=entryMin(e); $('eMin').value=m; paintEQuick(m);
    $('eWhen').value=toLocalInput(e.ts);
    eCat=(e.type==='work'&&e.cat)?e.cat:cat; renderECats();
    $('eNote').value=e.note||'';
    $('editModal').hidden=false;
  }
  function saveEdit(){
    const e=state.entries.find(x=>x.id===editId); if(!e) return;
    let m=parseInt($('eMin').value,10); if(!(m>0)) m=25; m=Math.min(1440,m);
    let ts=new Date($('eWhen').value).getTime(); if(isNaN(ts)) ts=Date.now();
    e.type=eType; e.min=m; e.ts=ts; e.cat=eType==='work'?eCat:''; e.note=($('eNote').value||'').trim();
    saveData(); render(); schedulePush();
    $('editModal').hidden=true;
  }
  function deleteEntry(id){
    const e=state.entries.find(x=>x.id===id); if(!e) return;
    askConfirm('确认删除这条记录？', '时间 '+fmtTime(e.ts)+' · '+(e.type==='work'?'专注':'休息')+' '+entryMin(e)+'′'+(e.cat?(' · '+e.cat):''), ()=>{
      state.entries=state.entries.filter(x=>x.id!==id);
      saveData(); render(); schedulePush();
    });
  }

  // ---- 通用确认框 ----
  let confirmCb=null;
  function askConfirm(title,msg,cb){ $('confirmTitle').textContent=title; $('confirmMsg').textContent=msg; confirmCb=cb; $('confirmModal').hidden=false; }
  $('confirmOk').onclick=()=>{ const f=confirmCb; confirmCb=null; $('confirmModal').hidden=true; if(f) f(); };
  $('confirmCancel').onclick=()=>{ confirmCb=null; $('confirmModal').hidden=true; };

  // ---- 编辑弹窗事件 ----
  $('eType').querySelectorAll('.seg-btn').forEach(b=>b.onclick=()=>{ eType=b.dataset.t; paintEType(); });
  $('eQuick').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ $('eMin').value=c.dataset.m; paintEQuick(+c.dataset.m); });
  $('eMin').oninput=()=>{ const v=parseInt($('eMin').value,10); paintEQuick(v); };
  $('eClose').onclick=()=>{ $('editModal').hidden=true; };
  $('eSave').onclick=saveEdit;

  $('catAddBtn').onclick=()=>{
    const v=$('catNew').value.trim();
    if(!v){ setCatStatus('请输入类别名称','bad'); return; }
    if(catDraft.some(r=>String(r.name).trim()===v)){ setCatStatus('已存在同名类别','bad'); return; }
    catDraft.push({id:uid(), name:v, orig:null});
    $('catNew').value=''; renderCatMgr(); setCatStatus('');
  };
  $('catNew').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('catAddBtn').click(); } };
  $('catSave').onclick=saveCatMgr;
  $('catClose').onclick=()=>{ $('catModal').hidden=true; };

  $('syncOpen').onclick=()=>{ $('syncToken').value=cfg.token||''; $('syncGist').value=cfg.gistId||''; $('syncModal').hidden=false; };
  $('syncClose').onclick=()=>{ $('syncModal').hidden=true; };
  $('syncEnable').onclick=async()=>{
    cfg.token=$('syncToken').value.trim(); cfg.gistId=$('syncGist').value.trim(); cfg.enabled=true; saveCfg();
    setStatus('正在同步…',''); await syncNow(); updateChip();
    if(cfg.enabled) setStatus('同步已启用。'+(cfg.gistId?('Gist ID：'+cfg.gistId):''),'ok');
  };
  $('syncDiag').onclick=async()=>{
    if(!cfg.token){ setStatus('请先填写 Token。','bad'); return; }
    try{ const u=await gistReq('GET','/user'); setStatus('Token 有效，账号：'+u.login+(cfg.gistId?('\nGist ID：'+cfg.gistId):'\n尚未绑定 Gist（启用后将自动创建）'),'ok'); }
    catch(e){ setStatus('Token 校验失败（'+(e&&e.status)+'）。可能已失效，请新建。','bad'); }
  };

  // ---- boot ----
  saveData(); render(); updateChip(); startAutoPull();
  setInterval(updateChip, 1000);
  if(navigator.serviceWorker){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
})();
</script>
</body>
</html>
